<svg viewBox="0 0 320 250" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Left rope (longer) -->
  <path d="M92,6 Q85,55 81,108" stroke="#9d7a52" stroke-width="3" stroke-linecap="round"/>
  <!-- Right rope (shorter) -->
  <path d="M213,6 Q219,43 227,83" stroke="#9d7a52" stroke-width="3" stroke-linecap="round"/>

  <!-- Wooden sign rotated -10deg around its centre (160,130) -->
  <g transform="rotate(-10, 160, 130)">

    <!-- Drop shadow -->
    <rect x="63" y="98" width="200" height="70" rx="5" fill="#4a2808" opacity="0.28"/>

    <!-- Wood base -->
    <rect x="60" y="95" width="200" height="70" rx="5" fill="#c07f2e"/>

    <!-- Wood grain -->
    <path d="M60,106 Q160,103 260,106" stroke="#a86a22" stroke-width="1.2" opacity="0.55"/>
    <path d="M60,115 Q160,118 260,114" stroke="#d4943e" stroke-width="0.9" opacity="0.4"/>
    <path d="M60,126 Q160,123 260,127" stroke="#a86a22" stroke-width="1.1" opacity="0.5"/>
    <path d="M60,137 Q160,140 260,136" stroke="#d4943e" stroke-width="0.9" opacity="0.35"/>
    <path d="M60,149 Q160,146 260,150" stroke="#a86a22" stroke-width="1.1" opacity="0.5"/>
    <path d="M60,160 Q160,163 260,159" stroke="#d4943e" stroke-width="0.8" opacity="0.3"/>

    <!-- Wood knot (between "4" and "0") -->
    <circle cx="128" cy="148" r="6"  stroke="#a06018" stroke-width="1"   opacity="0.45"/>
    <circle cx="128" cy="148" r="3"  stroke="#a06018" stroke-width="0.8" opacity="0.35"/>
    <circle cx="128" cy="148" r="1"  fill="#a06018"                      opacity="0.3"/>

    <!-- Board border -->
    <rect x="60" y="95" width="200" height="70" rx="5" stroke="#8b4f1a" stroke-width="2.5"/>

    <!-- Rope holes -->
    <circle cx="86"  cy="97" r="3.5" fill="#6a3510"/>
    <circle cx="234" cy="97" r="3.5" fill="#6a3510"/>

    <!-- ============ BRANCH CHARACTERS ============ -->
    <!-- stroke colour: #2a1004, width 6, linecap round -->

    <!-- First "4" -->
    <line x1="80"  y1="104" x2="80"  y2="126" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <line x1="76"  y1="126" x2="113" y2="126" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <line x1="113" y1="104" x2="113" y2="154" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <!-- offshoots -->
    <line x1="80"  y1="104" x2="74"  y2="98"  stroke="#2a1004" stroke-width="4"   stroke-linecap="round"/>
    <line x1="80"  y1="104" x2="86"  y2="99"  stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="113" y1="154" x2="108" y2="160" stroke="#2a1004" stroke-width="4"   stroke-linecap="round"/>
    <line x1="113" y1="154" x2="118" y2="159" stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="76"  y1="126" x2="72"  y2="121" stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <!-- woody knobs at joints -->
    <circle cx="80"  cy="126" r="3.5" fill="#2a1004"/>
    <circle cx="113" cy="126" r="3.5" fill="#2a1004"/>

    <!-- "0" -->
    <path d="M134,130 C134,116 146,104 160,104 C174,104 186,116 186,130 C186,144 174,156 160,156 C146,156 134,144 134,130 Z"
          fill="none" stroke="#2a1004" stroke-width="6"/>
    <!-- offshoots -->
    <line x1="136" y1="105" x2="131" y2="99"  stroke="#2a1004" stroke-width="4"   stroke-linecap="round"/>
    <line x1="184" y1="105" x2="189" y2="99"  stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="134" y1="130" x2="128" y2="126" stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Second "4" -->
    <line x1="211" y1="104" x2="211" y2="126" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <line x1="207" y1="126" x2="244" y2="126" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <line x1="244" y1="104" x2="244" y2="154" stroke="#2a1004" stroke-width="6"   stroke-linecap="round"/>
    <!-- offshoots -->
    <line x1="211" y1="104" x2="205" y2="98"  stroke="#2a1004" stroke-width="4"   stroke-linecap="round"/>
    <line x1="211" y1="104" x2="217" y2="99"  stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="244" y1="154" x2="239" y2="160" stroke="#2a1004" stroke-width="4"   stroke-linecap="round"/>
    <line x1="244" y1="154" x2="249" y2="159" stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="207" y1="126" x2="203" y2="121" stroke="#2a1004" stroke-width="3.5" stroke-linecap="round"/>
    <!-- woody knobs -->
    <circle cx="211" cy="126" r="3.5" fill="#2a1004"/>
    <circle cx="244" cy="126" r="3.5" fill="#2a1004"/>

  </g>

  <!-- Nails (rendered above ropes) -->
  <ellipse cx="92"  cy="7" rx="5" ry="4" fill="#6e5f4e"/>
  <circle  cx="92"  cy="6" r="2.5"       fill="#4a3d2e"/>
  <ellipse cx="213" cy="7" rx="5" ry="4" fill="#6e5f4e"/>
  <circle  cx="213" cy="6" r="2.5"       fill="#4a3d2e"/>

</svg>
